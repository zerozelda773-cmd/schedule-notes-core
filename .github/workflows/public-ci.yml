# SPDX-License-Identifier: Apache-2.0
name: Public Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Locked zero-dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deterministic synthetic generation
        run: npm run generate
      - name: Synthetic provenance and schema contract
        run: npm run provenance
      - name: Registered public build
        run: npm run build
      - name: Unit, contract and import reliability tests
        run: npm test
      - name: Secrets, public manifest, license and syntax
        run: python3 tools/check.py
      - name: Generated files remain clean
        run: git diff --exit-code
