# SPDX-License-Identifier: Apache-2.0
name: Public Core CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Locked zero-dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deterministic synthetic generation
        run: npm run generate
      - name: Synthetic provenance and schema contract
        run: npm run provenance
      - name: Registered public build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: API, schema, identity, period and output contracts
        run: npm run test:contract
      - name: Storage transactions
        run: npm run test:storage
      - name: Old schema migration and snapshot migration
        run: npm run test:migration
      - name: Single and multi entity import
        run: npm run test:import
      - name: Snapshot roundtrip and recovery
        run: npm run test:recovery
      - name: Atomic Activity and end to end integration
        run: npm run test:integration
      - name: Frozen API, adapter conformance, property, determinism, headless and package consumer
        run: npm run test:phase4
      - name: Experimental Wave 1 and immutable baseline guards
        run: npm run test:wave1
      - name: Experimental declaration syntax, no semantic type compiler implied
        run: node scripts/check-types.cjs types/experimental-wave1.d.ts
      - name: Lightweight declaration syntax, no semantic type compiler implied
        run: npm run check:types
      - name: Real browser persistence, crash, restart and recovery
        run: npm run test:browser
      - name: Real browser Experimental Wave 1 pure contracts
        run: npm run test:wave1-browser
      - name: Chromium same-revision CAS and durable browser matrix
        run: node scripts/browser-matrix.cjs chromium
      - name: Firefox same-revision CAS and durable browser matrix
        run: node scripts/browser-matrix.cjs firefox
      - name: Minimal public API example
        run: node examples/reliability.cjs
      - name: Secrets, public manifest, license and syntax
        run: python3 tools/check.py
      - name: Dangerous API sinks
        run: python3 tools/dangerous.py
      - name: Synthetic performance trend, correctness first
        run: npm run benchmark
      - name: Generated files remain clean
        run: git diff --exit-code
